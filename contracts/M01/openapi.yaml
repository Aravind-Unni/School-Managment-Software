openapi: 3.0.3
info:
  title: School platform API
  version: school-contracts-v3-draft
  description: Per-module REST API. One module is served per standalone profile.
paths:
  /api/v1/accounts:
    get:
      operationId: accounts_list
      description: |-
        Return a cursor page of accounts.

        Requires ``accounts.manage``, which the catalogue marks as needing a fresh
        second factor -- so a password-only session is refused here with 401. That is
        the acceptance case "business API refused before 2FA completes".
      summary: List accounts in the caller's school
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: Opaque keyset cursor. Do not parse.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Capped server-side.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountCollectionResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeResponse'
          description: Client asserted its own identity.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeResponse'
          description: Unauthenticated, expired challenge, or step-up required.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeResponse'
          description: Action denied.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeResponse'
          description: Absent, or not visible to you.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeResponse'
          description: Version or state conflict.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeResponse'
          description: Validation failed, or an unknown field.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelopeResponse'
          description: Throttled; carries Retry-After.
  /api/v1/auth/2fa/confirm:
    post:
      operationId: auth_factor_enrol_confirm
      description: |-
        Activate the pending factor and return ten single-use codes.

        The codes appear here and nowhere else. Only hashes are stored.
      summary: Activate the factor and receive recovery codes once
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrolConfirmRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnrolConfirmRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnrolConfirmRequestRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
