# nginx: TLS-ready reverse proxy for the school product.
# TLS certificates are mounted at /etc/nginx/certs when present; otherwise
# the server listens on :80 for a local smoke / ACME HTTP-01 front door.

upstream school_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    location /healthz {
        proxy_pass http://school_api/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /readyz {
        proxy_pass http://school_api/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://school_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie $http_cookie;
    }

    location /api/schema/ {
        proxy_pass http://school_api/api/schema/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
