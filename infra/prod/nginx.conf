# nginx: serves the built frontend and proxies /api to gunicorn.
# Sits behind Caddy (TLS). The scheme and client address Caddy reports are
# passed through; when nginx is hit directly (local rehearsal) its own values
# are used instead.

upstream school_api {
    server api:8000;
}

map $http_x_forwarded_proto $school_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_real_ip $school_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        proxy_pass http://school_api/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $school_forwarded_proto;
    }

    # Readiness reports internal configuration; only the server itself may read it.
    location = /readyz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://school_api/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $school_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://school_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $school_forwarded_proto;
        proxy_set_header X-Real-IP $school_client_ip;
        proxy_set_header X-Forwarded-For $school_client_ip;
        proxy_read_timeout 120s;
    }

    # Hashed build assets never change; cache them hard.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
