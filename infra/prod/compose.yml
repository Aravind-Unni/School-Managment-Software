# Production compose for one school deployment (browser via nginx).
# Usage (from repo root):
#   cp infra/prod/.env.example infra/prod/.env   # fill secrets
#   docker compose -f infra/prod/compose.yml --env-file infra/prod/.env up -d --build
#
# Does not handle: multi-school tenancy (one SCHOOL_ID per deployment).

name: school_prod

services:
  postgres:
    image: docker.io/library/postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - school_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  broker:
    image: docker.io/library/redis@sha256:e2c307e77bcaf306fa9e468bda845165a46c4c015ffd238fb3c92ae5d71d486f
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY}
    volumes:
      - school_prod_objects:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/prod/backend.Dockerfile
      args:
        PYTHON_IMAGE: docker.io/library/python@sha256:8cbe7fcd5df843c789eb26a3d3059859469441633d6e671111f31553e8dc7156
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.production
      MODULE_ID: ALL
      SCHOOL_ID: ${SCHOOL_ID}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      BROKER_URL: redis://broker:6379/0
      WORKER_AVAILABLE: "true"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      DEV_PERSONA_MODE: "off"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      SCHOOL_CONFIG_FILE: /app/school.toml
      PLATFORM_OPS_ACTOR_IDS: ${PLATFORM_OPS_ACTOR_IDS:-}
    volumes:
      - ./school.toml:/app/school.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker: &worker
    build:
      context: ../..
      dockerfile: infra/prod/backend.Dockerfile
      args:
        PYTHON_IMAGE: docker.io/library/python@sha256:8cbe7fcd5df843c789eb26a3d3059859469441633d6e671111f31553e8dc7156
    command: ["/app/entrypoint-worker.sh"]
    environment:
      APP_ENV: production
      DJANGO_SETTINGS_MODULE: config.settings.production
      MODULE_ID: ALL
      SCHOOL_ID: ${SCHOOL_ID}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      BROKER_URL: redis://broker:6379/0
      WORKER_AVAILABLE: "true"
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      DEV_PERSONA_MODE: "off"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      SCHOOL_CONFIG_FILE: /app/school.toml
    volumes:
      - ./school.toml:/app/school.toml:ro
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

  # Runs every module's declared periodic job (outbox, reconciles, cleanups).
  scheduler:
    <<: *worker
    command: ["/app/entrypoint-scheduler.sh"]

  # Nightly database + file backups into the school_prod_backups volume, kept
  # for BACKUP_KEEP_DAYS. Copy that volume off the server (see RUNBOOK).
  backup:
    image: docker.io/library/postgres@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-20}
      TZ: UTC
    volumes:
      - school_prod_backups:/backups
      - school_prod_objects:/objects:ro
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/prod/frontend.Dockerfile
      args:
        NODE_IMAGE: docker.io/library/node@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
        NGINX_IMAGE: docker.io/library/nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # TLS front door. With DOMAIN set to the school's hostname, Caddy obtains
  # and renews a Let's Encrypt certificate automatically. For a local
  # rehearsal set DOMAIN=localhost (self-signed) or use HOST_HTTP_PORT only.
  caddy:
    image: docker.io/library/caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
      - "${HOST_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - school_prod_caddy_data:/data
      - school_prod_caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  school_prod_pg:
  school_prod_objects:
  school_prod_backups:
  school_prod_caddy_data:
  school_prod_caddy_config:
